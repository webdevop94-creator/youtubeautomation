<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./assets/three.module.js", "three/addons/": "./assets/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const FILES = ["Running.fbx","Fighting Idle.fbx","Punch To Elbow Combo.fbx",
               "Strut Walking.fbx","Catwalk Walk Forward HighKnees.fbx",
               "Dancing Running Man.fbx","Golf Pre-Putt.fbx",
               "Capoeira.fbx","char_talking.fbx"];
const out = [];
for (const f of FILES) {
  try {
    const a = await new Promise((res, rej) =>
      new FBXLoader().load('./assets/mixamo/' + encodeURIComponent(f), res, undefined, rej));
    const clips = (a.animations || []).filter(c => c.duration > 0.1)
      .map(c => ({ dur: +c.duration.toFixed(2), tracks: c.tracks.length }));
    let skinned = 0, bones = 0;
    a.traverse(o => { if (o.isSkinnedMesh) skinned++; if (o.isBone) bones++; });
    out.push({ file: f, clips, skinnedMeshes: skinned, bones });
  } catch (e) { out.push({ file: f, error: String(e).slice(0, 80) }); }
}
window.__out = out; window.__done = true;
</script>
