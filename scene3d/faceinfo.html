<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "./assets/three.module.js",
  "three/addons/": "./assets/addons/",
  "fflate": "./assets/addons/libs/fflate.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Can this model's mouth move at all? Two ways it could: blend shapes on the
// head mesh, or a jaw bone in the skeleton. Mixamo's auto-rig gives neither,
// so the answer decides whether lip-sync needs a different model or a
// different technique entirely.
const FILES = new URLSearchParams(location.search).get('files').split(',');

const load = p => new Promise((res, rej) => {
  const loader = p.endsWith('.fbx') ? new FBXLoader() : new GLTFLoader();
  loader.load(p, res, undefined, rej);
});

const out = [];
for (const file of FILES) {
  try {
    const asset = await load(file);
    const root = asset.scene || asset;
    const morphs = new Set();
    const face = [];
    const head = [];
    root.updateMatrixWorld(true);
    root.traverse(o => {
      if (o.isMesh && o.morphTargetDictionary) {
        Object.keys(o.morphTargetDictionary).forEach(k => morphs.add(k));
      }
      if (o.isBone && /jaw|mouth|teeth|tongue|lip|chin/i.test(o.name)) face.push(o.name);
      // The rig knows how long the head is even when hair or a hat makes the
      // model's bounding box say otherwise.
      if (o.isBone && /head/i.test(o.name)) head.push([o.name, +o.getWorldPosition(new THREE.Vector3()).y.toFixed(1)]);
    });
    out.push({ file, morphs: [...morphs].slice(0, 40), faceBones: face, head });
  } catch (e) {
    out.push({ file, error: String(e).slice(0, 120) });
  }
}
window.__out = out;
window.__done = true;
</script>
