<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./assets/three.module.js", "three/addons/": "./assets/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// A two-character talking scene, rendered frame by frame from outside.
//
// The one non-obvious part is retargeting. Ready Player Me avatars carry the
// Mixamo skeleton but drop the "mixamorig" prefix from every bone, so Mixamo
// clips bind to exactly zero nodes and the character stands in its bind pose
// looking broken. Stripping the prefix from the track names fixes it -- the
// skeletons are otherwise identical.

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1280);
const H = +(params.get('h') || 720);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);

// --- rooms ----------------------------------------------------------------
// Flat, bright colour blocks. Cartoon channels do not use moody lighting, and
// simple geometry keeps the render fast enough to be worth doing at all.
const ROOMS = {
  classroom: { wall: 0xf0dcb8, floor: 0x9a6b45, panel: 0x2f6b4f, accent: 0x8d5a3b },
  clinic:    { wall: 0xd6ecf5, floor: 0xa8b6bc, panel: 0xffffff, accent: 0xbfcbd1 },
  home:      { wall: 0xf6e3c8, floor: 0xa5703f, panel: 0xe8cfa8, accent: 0x9c6b3f },
  office:    { wall: 0xdfe4ee, floor: 0x7c8490, panel: 0xfafafa, accent: 0xaab2bd },
  shop:      { wall: 0xf3e6bd, floor: 0x93673f, panel: 0xf0dfae, accent: 0xa07a45 },
  park:      { wall: 0x9fd8f5, floor: 0x76c46f, panel: 0x9fd8f5, accent: 0x5aa657 },
};

function buildRoom(name) {
  const c = ROOMS[name] || ROOMS.classroom;
  const group = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: c.floor, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  group.add(floor);

  const back = new THREE.Mesh(new THREE.PlaneGeometry(40, 14),
    new THREE.MeshStandardMaterial({ color: c.wall, roughness: 1 }));
  back.position.set(0, 7, -6);
  back.receiveShadow = true;
  group.add(back);

  // A board / window / counter, depending on the room. It gives the frame a
  // focal point and stops the wall reading as empty.
  if (name !== 'park') {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(7.2, 3.2, 0.18),
      new THREE.MeshStandardMaterial({ color: c.accent, roughness: 1 }));
    frame.position.set(0, 2.6, -5.85);
    frame.castShadow = true;
    group.add(frame);

    const panel = new THREE.Mesh(new THREE.BoxGeometry(6.8, 2.8, 0.06),
      new THREE.MeshStandardMaterial({ color: c.panel, roughness: 1 }));
    panel.position.set(0, 2.6, -5.72);
    group.add(panel);
  } else {
    for (const [x, z, s] of [[-5, -4, 1.3], [5.5, -3, 1.1], [-2, -5, 0.9]]) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * s, 0.28 * s, 2.2 * s, 8),
        new THREE.MeshStandardMaterial({ color: 0x8a5a34 }));
      trunk.position.set(x, 1.1 * s, z);
      trunk.castShadow = true;
      group.add(trunk);
      const top = new THREE.Mesh(new THREE.SphereGeometry(1.15 * s, 12, 10),
        new THREE.MeshStandardMaterial({ color: 0x4fa64a }));
      top.position.set(x, 2.6 * s, z);
      top.castShadow = true;
      group.add(top);
    }
  }
  return group;
}

// --- lighting -------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xffffff, 0x9d8158, 2.3));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -12; key.shadow.camera.right = 12;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
scene.add(key);

// --- loading --------------------------------------------------------------
// A fresh loader per file, deliberately. FBXLoader keeps its parse state in
// module scope, so loading a second FBX through the same instance hands it the
// first file's textures -- two different characters render as the same one,
// and the file on disk looks like the culprit when it is not.
const load = p => new Promise((res, rej) => {
  const loader = p.endsWith('.fbx') ? new FBXLoader() : new GLTFLoader();
  loader.load(p, res, undefined, rej);
});

// How tall a character stands, in metres -- the rooms are built in metres,
// while Mixamo exports each character in units of its own choosing.
const TARGET_HEIGHT = 1.6;

/** Move a clip from the source rig onto a target rig.
 *
 * Renaming the tracks is not enough. The two skeletons share bone names once
 * the "mixamorig" prefix is stripped, but they do not share a rest pose --
 * Xbot rests in a T-pose, the avatar in an A-pose. Copying raw local
 * rotations across that difference produces a character with its legs coming
 * out of its head, which is what happened before this used SkeletonUtils.
 *
 * retargetClip computes the delta between the two rest poses, which is the
 * part that actually makes the motion transfer.
 */
function retarget(targetModel, sourceModel, clip) {
  const names = {};
  sourceModel.traverse(o => {
    if (o.isBone) names[o.name] = o.name.replace(/^mixamorig/, '');
  });
  const out = SkeletonUtils.retargetClip(targetModel, sourceModel, clip, {
    names,
    hip: 'mixamorigHips',
    // Characters stand and talk; root motion would slide them off their mark.
    useFirstFramePosition: true,
  });
  out.name = clip.name;
  return out;
}

const actors = [];   // { model, mixer, morphMeshes, actions }

/** An FBX loads as the object itself; a glTF wraps it in .scene. */
function rootOf(asset) {
  return asset.scene || asset;
}

/** Make one model read as a second, different person.
 *
 * Mixamo characters carry their whole appearance in a single textured
 * material, so recolouring alone tints the skin along with the clothes. Three
 * weaker signals together do the job better than one strong one: a height
 * difference, a small hue shift, and -- the one that matters most -- a time
 * offset, because two figures moving in perfect lockstep read as a mirror
 * rather than as two people.
 */
const VARIANT = { scale: 0.88, hue: 0.42, timeOffset: 1.7 };

/** Make a Mixamo clip safe to play on a different Mixamo character.
 *
 * Every Mixamo character shares one skeleton and one set of bone names, so
 * rotations transfer as they are. Positions do not: each character is exported
 * in its own units, so the hips track moves a short character kilometres. Drop
 * the position tracks and the clip becomes portable.
 */
function shareable(clip) {
  const out = clip.clone();
  out.tracks = out.tracks.filter(t => !t.name.endsWith('.position'));
  return out;
}

/** Each bone's rotation in the bind pose, read from the skinning data.
 *
 * A bone's own transform is not the rest pose: Mixamo bakes the first frame of
 * whichever animation the character was downloaded with into the node
 * transforms, so a character downloaded mid-crouch "rests" in a crouch. The
 * inverse bind matrices are the one record of how the skeleton stood when the
 * mesh was bound to it.
 */
function restPose(root) {
  const map = new Map();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3();

  // The body's skeleton, not whichever mesh happens to come first: hair and
  // clothing are skinned separately and can carry their own partial skeletons.
  let skeleton = null;
  root.traverse(mesh => {
    if (mesh.isSkinnedMesh && mesh.skeleton &&
        (!skeleton || mesh.skeleton.bones.length > skeleton.bones.length)) {
      skeleton = mesh.skeleton;
    }
  });
  if (!skeleton) return map;

  const { bones, boneInverses } = skeleton;
  const world = boneInverses.map(m => m.clone().invert());
  bones.forEach((bone, i) => {
    const parent = bones.indexOf(bone.parent);
    const local = parent < 0 ? world[i].clone()
                             : world[parent].clone().invert().multiply(world[i]);
    const q = new THREE.Quaternion();
    local.decompose(pos, q, scl);
    map.set(bone.name, q);
  });
  return map;
}

/** Re-express a clip against the target's own rest pose.
 *
 * Copying local rotations across characters assumes both rigs rest the same
 * way, and they do not: one character rests with her head tilted back, so
 * playing another's head rotation left her staring at the ceiling for the
 * whole scene -- with her mouth aimed there too.
 *
 * What transfers is the movement away from rest, not the rotation itself. Rest
 * poses that do match give an identity correction, so this is safe to apply to
 * every bone rather than only the ones caught misbehaving.
 */
function toRestOf(clip, sourceRest, model) {
  const out = shareable(clip);
  const target = restPose(model);
  const q = new THREE.Quaternion();

  for (const track of out.tracks) {
    if (!track.name.endsWith('.quaternion')) continue;
    const bone = track.name.slice(0, -'.quaternion'.length);
    const from = sourceRest.get(bone), to = target.get(bone);
    if (!from || !to) continue;

    const correction = to.clone().multiply(from.clone().invert());
    const v = track.values;
    for (let i = 0; i + 3 < v.length; i += 4) {
      q.set(v[i], v[i + 1], v[i + 2], v[i + 3]).premultiply(correction);
      v[i] = q.x; v[i + 1] = q.y; v[i + 2] = q.z; v[i + 3] = q.w;
    }
  }
  return out;
}

// Whichever character is loaded, this is the animation it speaks with. Letting
// each model play the clip it happened to be downloaded with means a character
// downloaded with a dance clip dances through its dialogue.
const TALK_CLIP = './assets/mixamo/char_talking.fbx';

/** Give a character a mouth that can open.
 *
 * Mixamo's auto-rigger strips the facial rig: not one of these models has a
 * blend shape or a jaw bone, and the mouth is painted into the face texture.
 * So the mouth is added as its own small mesh, sitting just off the face and
 * parented to the head bone so it follows every turn and nod.
 *
 * It is hidden when the character is quiet, which uncovers the painted smile
 * underneath -- open when speaking, smiling when not, which is how hand-drawn
 * cartoons have always done it.
 *
 * Where the face is cannot be guessed. These characters range from ordinary
 * proportions to a head half the height of the body, so a fixed depth either
 * buries the mouth inside the skull or leaves it floating in front. Instead a
 * ray is fired outward from inside the head and the mouth is placed wherever
 * it leaves the surface.
 */
// Everything here is a fraction of the character's own head, never a fixed
// size. These heads run from a seventh of the body to nearly a third, so a
// mouth measured in centimetres fits one of them and swallows the next one's
// face. The rig's Head-to-HeadTop_End distance gives the head's true length,
// which the model's bounding box does not -- hair and a cap are in the box.
const MOUTH = {
  up: 0.15,        // above the head bone, towards the crown
  width: 0.15,
  height: 0.18,    // wide open
  out: 0.03,       // clear of the skin, so it never z-fights
  colour: 0x531d21,
};

function findBone(model, re) {
  let found = null;
  model.traverse(o => { if (!found && o.isBone && re.test(o.name)) found = o; });
  return found;
}

// Measuring from the chin was tried and does not work: hair is skinned to the
// head bone exactly like the chin is, so a fringe or a set of curlers becomes
// the lowest "head" vertex and the mouth follows it down the neck. The head
// bone to the crown bone is the one span the rig reports honestly.

function addMouth(model, box) {
  const head = findBone(model, /head$/i) || findBone(model, /head/i);
  if (!head) return null;
  model.updateMatrixWorld(true);

  const headPos = new THREE.Vector3();
  head.getWorldPosition(headPos);

  const crown = findBone(model, /headtop/i);
  const crownY = crown ? crown.getWorldPosition(new THREE.Vector3()).y
                       : box.max.y * model.scale.y + model.position.y;
  const span = Math.max(0.02, crownY - headPos.y);

  const forward = new THREE.Vector3(0, 0, 1).applyEuler(model.rotation).normalize();
  const origin = headPos.clone().setY(headPos.y + span * MOUTH.up);
  // The outermost hit, not the first: the ray starts inside the head, so it
  // leaves through eyeballs and teeth before it reaches the skin. Capped at
  // roughly a head's width so a stray hair or a cap brim cannot pull the mouth
  // out into the air.
  const hits = new THREE.Raycaster(origin, forward, 0.001, span * 1.3)
    .intersectObject(model, true).filter(h => h.object.isMesh);
  const surface = hits.length ? hits[hits.length - 1].point
                              : origin.clone().addScaledVector(forward, span * 0.5);

  // A squashed sphere: rounded at the corners the way a drawn mouth is, and
  // symmetrical, so nothing depends on which way its geometry was authored.
  const mouth = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 20, 14),
    new THREE.MeshBasicMaterial({ color: MOUTH.colour }));
  mouth.visible = false;
  head.add(mouth);
  mouth.position.copy(head.worldToLocal(
    surface.clone().addScaledVector(forward, span * MOUTH.out)));

  // Sit it square to the character rather than to the bone: Mixamo's head bone
  // points up the neck, so its own axes would tip the mouth on its side.
  const hq = new THREE.Quaternion(), mq = new THREE.Quaternion();
  head.getWorldQuaternion(hq);
  model.getWorldQuaternion(mq);
  mouth.quaternion.copy(hq.invert().multiply(mq));

  // The bone carries the model's scale, so undo it: sizes below are in world
  // metres, derived from this character's own head.
  mouth.userData.unit = span / (model.scale.x || 1);
  return mouth;
}

// How far the pair angle in towards each other, in radians. Square to camera
// reads as two people addressing the viewer; turned, as two people talking.
const TURN = 0.42;

async function makeActor(avatarPath, clipSource, x, faceLeft, variant, talk,
                         turn = TURN) {
  const asset = await load(avatarPath);
  const model = rootOf(asset);
  asset.animations = asset.animations || model.animations || [];

  // Scale off the model's own height, not a fixed factor. Mixamo exports each
  // character in its own units, so a single constant makes one character
  // correct and the next one a giant standing beside it.
  //
  // Height is measured to the crown bone rather than the top of the bounding
  // box, because the box contains hair: a character in curlers and a cap was
  // scaled down until her face sat below everyone else's and the camera looked
  // over the top of her head.
  const wanted = TARGET_HEIGHT * (variant ? VARIANT.scale : 1);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const crown = findBone(model, /headtop/i);
  const top = crown ? crown.getWorldPosition(new THREE.Vector3()).y : box.max.y;
  const height = top - box.min.y;
  if (height > 0.0001) model.scale.setScalar(wanted / height);

  const morphMeshes = [];
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      if (o.morphTargetDictionary) morphMeshes.push(o);
      if (variant) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        o.material = mats.map(m => {
          if (!m) return m;
          const c = m.clone();
          if (c.color) {
            const hsl = {};
            c.color.getHSL(hsl);
            c.color.setHSL((hsl.h + VARIANT.hue) % 1,
                           Math.min(1, hsl.s + 0.25), hsl.l);
          }
          return c;
        });
        if (o.material.length === 1) o.material = o.material[0];
      }
    }
  });
  // Stand it on the floor: a rig whose origin sits at the hips rather than the
  // feet otherwise sinks into the ground or floats above it.
  model.position.set(x, -box.min.y * model.scale.y, 0);
  model.rotation.y = faceLeft ? -turn : turn;
  scene.add(model);
  const mouth = addMouth(model, box);
  const gltf = asset;

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};

  // A model that ships its own clips needs no retargeting at all, and that is
  // by far the most reliable path: cross-rig retargeting between a T-pose and
  // an A-pose skeleton is where this broke repeatedly.
  // Mixamo names every clip "mixamo.com" and adds an empty "Take 001"; both
  // are useless as keys, so clips are numbered by order instead.
  const clips = {};
  const own = (gltf.animations || []).filter(c => c.duration > 0.1).map(shareable);
  const borrowed = (talk ? talk.clips : []).map(c => toRestOf(c, talk.rest, model));
  if (own.length || borrowed.length) {
    // Borrowed clips come first so the shared talking animation wins the 'talk'
    // key: a character downloaded with a dance clip should still speak its
    // lines rather than dance through them.
    [...borrowed, ...own].forEach((clip, i) => {
      const key = i === 0 ? 'talk' : 'clip' + i;
      clips[key] = clip;
      actions[key] = mixer.clipAction(clip);
    });
  } else {
    for (const clip of clipSource.animations) {
      try {
        actions[clip.name] = mixer.clipAction(retarget(model, clipSource.scene, clip));
      } catch (e) {
        console.warn('retarget failed:', clip.name, String(e).slice(0, 90));
      }
    }
  }
  const base = actions['talk'] || actions['idle'] || Object.values(actions)[0];
  if (base) base.play();
  return {
    model, mixer, morphMeshes, actions, clips, mouth, current: base,
    timeOffset: variant ? VARIANT.timeOffset : 0,
  };
}

let room = null;

window.__setup = async (cfg) => {
  try {
    const clipSource = await load('./assets/Xbot.glb');
    const actorA = cfg.actorA || './assets/mixamo/char_talking.fbx';
    const actorB = cfg.actorB || actorA;

    room = buildRoom(cfg.room || 'classroom');
    scene.add(room);
    scene.background = new THREE.Color(
      (ROOMS[cfg.room] || ROOMS.classroom).wall).convertSRGBToLinear();

    const talkAsset = await load(cfg.clip || TALK_CLIP);
    const talk = { clips: talkAsset.animations || [],
                   rest: restPose(rootOf(talkAsset)) };
    const turn = cfg.turn === undefined ? TURN : cfg.turn;
    actors.push(await makeActor(actorA, clipSource, -1.05, false, false, talk, turn));
    // The second actor is disguised only when it is the same model as the
    // first; a genuinely different character needs no disguising.
    actors.push(await makeActor(actorB, clipSource, 1.05, true,
                                actorB === actorA && cfg.varyB !== false, talk, turn));

    window.__clips = Object.keys(actors[0].actions);
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.message || e);
  }
};

/**
 * One frame.
 *   t        seconds into the beat
 *   speaker  0 or 1 -- whose mouth moves
 *   level    0..1 loudness at this instant, from the real audio
 *   shot     'wide' | 'left' | 'right'
 */
window.__renderFrame = (t, speaker, level, shot) => {
  for (let i = 0; i < actors.length; i++) {
    const a = actors[i];
    // Offsetting the second actor stops the pair moving as a mirror image,
    // which is what gives away that they are one model twice.
    a.mixer.setTime(t + (a.timeOffset || 0));

    const talking = i === speaker;
    // Mouth follows the audio, not a timer, so it stops when the voice stops.
    const open = talking ? Math.min(1, Math.max(0, level) * 1.35) : 0;
    for (const mesh of a.morphMeshes) {
      const d = mesh.morphTargetDictionary;
      if (d.mouthOpen !== undefined) mesh.morphTargetInfluences[d.mouthOpen] = open;
      if (d.mouthSmile !== undefined) mesh.morphTargetInfluences[d.mouthSmile] = talking ? 0.2 : 0.4;
    }

    if (a.mouth) {
      // Below a whisper the mouth disappears and the painted smile shows
      // through, so a pause reads as a pause rather than a held vowel.
      a.mouth.visible = open > 0.06;
      if (a.mouth.visible) {
        const u = a.mouth.userData.unit;
        // Wider as it opens, but not in step -- a mouth that scales evenly
        // reads as a growing circle instead of a jaw coming down.
        a.mouth.scale.set(MOUTH.width * (0.72 + 0.28 * open) * u,
                          MOUTH.height * (0.18 + 0.82 * open) * u,
                          MOUTH.width * 0.45 * u);
      }
    }
  }

  // Framing: characters should fill the frame the way they do on a cartoon
  // channel, not stand small in a wide room.
  //
  // A camera's field of view is vertical, so a portrait frame sees barely a
  // third of the width a landscape one does. A Short therefore holds whoever
  // is speaking, from further back: the two-shot that reads well in 16:9 puts
  // both characters outside a 9:16 frame entirely.
  const sway = Math.sin(t * 0.25) * 0.18;
  const portrait = W < H;
  const view = portrait ? (speaker ? 'right' : 'left') : shot;

  if (view === 'left' || view === 'right') {
    const x = view === 'left' ? -1.05 : 1.05;
    camera.position.set(x * 0.95 + sway * 0.4, portrait ? 1.10 : 1.35,
                        portrait ? 2.6 : 1.55);
    camera.lookAt(x, portrait ? 0.85 : 1.25, 0);
  } else {
    camera.position.set(sway, 1.30, 2.9);
    camera.lookAt(0, 1.0, 0);
  }

  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};

window.__info = () => ({
  ready: !!window.__ready, error: window.__error || null,
  clips: window.__clips || [],
  morphs: actors[0] ? Object.keys(actors[0].morphMeshes[0]?.morphTargetDictionary || {}) : [],
  // Where each mouth ended up, against the head it was measured from. A mouth
  // that never appears on camera is either missing or buried, and only these
  // numbers say which.
  mouths: actors.map(a => {
    if (!a.mouth) return null;
    const p = a.mouth.getWorldPosition(new THREE.Vector3());
    const head = findBone(a.model, /head$/i);
    const crown = findBone(a.model, /headtop/i);
    const at = b => b ? +b.getWorldPosition(new THREE.Vector3()).y.toFixed(3) : null;
    return { y: +p.y.toFixed(3), z: +p.z.toFixed(3),
             head: at(head), crown: at(crown) };
  }),
});
</script>
