<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./assets/three.module.js", "three/addons/": "./assets/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// A two-character talking scene, rendered frame by frame from outside.
//
// The one non-obvious part is retargeting. Ready Player Me avatars carry the
// Mixamo skeleton but drop the "mixamorig" prefix from every bone, so Mixamo
// clips bind to exactly zero nodes and the character stands in its bind pose
// looking broken. Stripping the prefix from the track names fixes it -- the
// skeletons are otherwise identical.

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1280);
const H = +(params.get('h') || 720);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);

// --- sets -------------------------------------------------------------------
// A room used to be three flat bands: a floor, a back wall, and one rectangle
// standing in for a blackboard. On a close shot that is a plain wall behind a
// head, and half of a wide shot is empty floor -- which is most of why the
// videos read as unfinished rather than as scenes.
//
// What replaces it is a family house, inside and out. Everything is still
// boxes and cylinders, because that is what keeps a frame cheap enough to
// render thousands of times; what changed is that there are enough of them,
// and they are placed where the camera actually looks.
//
// Characters stand at x = +-1.05 with the camera between z = 1.5 and 2.9, so
// the band from x -3..3, z -6..0 has to stay clear. Everything below is either
// against the back wall, out past the characters' shoulders, or underfoot.

const PALETTES = {
  house_in:  { wall: 0xefdcc2, floor: 0x9d6a42, sky: null },
  house_out: { wall: 0xa8d8f0, floor: 0x7cbf62, sky: 0xa8d8f0 },
  classroom: { wall: 0xf0dcb8, floor: 0x9a6b45, sky: null },
  clinic:    { wall: 0xd6ecf5, floor: 0xa8b6bc, sky: null },
  office:    { wall: 0xdfe4ee, floor: 0x7c8490, sky: null },
  shop:      { wall: 0xf3e6bd, floor: 0x93673f, sky: null },
  park:      { wall: 0x9fd8f5, floor: 0x76c46f, sky: 0x9fd8f5 },
};
// Old names still resolve, so a job asking for "home" gets the new interior.
const ALIAS = { home: 'house_in', house: 'house_in', outside: 'house_out',
                garden: 'house_out' };

const mat = (color, rough = 0.95) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough });

/** A box at a place. Every prop in here is one of these or a cylinder. */
function box(group, w, h, d, color, x, y, z, rough) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, rough));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}

function cyl(group, rTop, rBot, h, color, x, y, z, seg = 10) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}

function plant(group, x, z, s = 1) {
  cyl(group, 0.22 * s, 0.28 * s, 0.42 * s, 0xc0703f, x, 0.21 * s, z);
  for (const [dx, dy, dz, r] of [[0, 0.62, 0, 0.34], [0.18, 0.48, 0.1, 0.24],
                                 [-0.16, 0.52, -0.08, 0.22]]) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(r * s, 10, 8), mat(0x4e9a52));
    leaf.position.set(x + dx * s, (dy + 0.2) * s, z + dz * s);
    leaf.castShadow = true;
    group.add(leaf);
  }
}

function tree(group, x, z, s = 1) {
  cyl(group, 0.2 * s, 0.28 * s, 2.2 * s, 0x8a5a34, x, 1.1 * s, z, 8);
  for (const [dy, r] of [[2.5, 1.15], [3.2, 0.85], [2.2, 0.9]]) {
    const top = new THREE.Mesh(new THREE.SphereGeometry(r * s, 12, 10), mat(0x4fa64a));
    top.position.set(x, dy * s, z);
    top.castShadow = true;
    group.add(top);
  }
}

/** The living room. Most scenes are two people talking, so the back wall does
 *  the most work: it is what sits behind every close-up. */
function buildHouseIn(g) {
  const WALL = 0xefdcc2, TRIM = 0xfbf3e6, WOOD = 0x8b5a33;

  // Side walls as well as a back one. A single plane behind the characters
  // reads as a backdrop; three walls read as a room they are standing in.
  box(g, 0.3, 7, 16, WALL, -7, 3.5, -1);
  box(g, 0.3, 7, 16, WALL, 7, 3.5, -1);
  box(g, 14, 7, 0.3, WALL, 0, 3.5, -6);
  // Skirting and a picture rail: two thin strips that give the wall a scale.
  box(g, 14, 0.28, 0.12, TRIM, 0, 0.14, -5.83);
  box(g, 14, 0.14, 0.1, TRIM, 0, 3.1, -5.85);

  // Everything below is placed against the back wall rather than out along the
  // side walls, because the camera sees far less width than the room has. At
  // the acting distance the frame is only about x -3..3, so the first version
  // of this room -- sofa at -5.4, shelf at 5.6 -- furnished two strips of wall
  // that never once appeared on screen.
  //
  // The window is the focal point and the light source in one. Sky behind it
  // rather than a flat panel, so the room reads as being somewhere.
  const wx = 2.1;
  box(g, 3.0, 2.2, 0.12, 0xbfe4f5, wx, 2.0, -5.86, 0.3);   // glazing
  box(g, 3.3, 0.16, 0.22, TRIM, wx, 3.15, -5.82);           // head
  box(g, 3.3, 0.16, 0.22, TRIM, wx, 0.85, -5.82);           // sill
  box(g, 0.16, 2.4, 0.22, TRIM, wx - 1.6, 2.0, -5.82);
  box(g, 0.16, 2.4, 0.22, TRIM, wx + 1.6, 2.0, -5.82);
  box(g, 0.1, 2.2, 0.16, TRIM, wx, 2.0, -5.8);              // centre bar
  // Curtains, which is what stops a window looking like a hole in a wall.
  box(g, 0.7, 2.7, 0.16, 0xc9584f, wx - 1.9, 2.05, -5.7);
  box(g, 0.7, 2.7, 0.16, 0xc9584f, wx + 1.9, 2.05, -5.7);

  // A door at the right edge, so the room has a way out without competing
  // with the window for the middle of the frame.
  box(g, 1.4, 2.9, 0.14, WOOD, 4.7, 1.45, -5.85);
  box(g, 1.7, 0.18, 0.2, TRIM, 4.7, 2.98, -5.82);
  cyl(g, 0.07, 0.07, 0.14, 0xd8b25a, 5.2, 1.45, -5.72, 8).rotation.x = Math.PI / 2;

  // Framed photographs, left of centre and behind whoever stands on that
  // side. Three, uneven, because a row of identical rectangles reads as a
  // pattern rather than as somebody's house.
  for (const [x, y, w, h, c] of [[-2.9, 2.5, 0.8, 0.62, 0xd9a441],
                                 [-1.9, 2.2, 0.6, 0.75, 0x7fa9c9],
                                 [-2.6, 1.5, 0.66, 0.5, 0xb2705f]]) {
    box(g, w + 0.1, h + 0.1, 0.08, 0x6b4529, x, y, -5.82);
    box(g, w, h, 0.04, c, x, y, -5.77);
  }

  // Sofa against the back wall on the left, facing the camera.
  const sx = -3.5;
  box(g, 2.6, 0.45, 1.05, 0xb8674f, sx, 0.36, -5.0);         // seat
  box(g, 2.6, 0.9, 0.32, 0xa55a44, sx, 0.85, -5.45);         // back
  box(g, 0.3, 0.28, 1.05, 0xa55a44, sx - 1.35, 0.75, -5.0);  // arm
  box(g, 0.3, 0.28, 1.05, 0xa55a44, sx + 1.35, 0.75, -5.0);  // arm
  for (const dx of [-0.7, 0, 0.7]) {
    box(g, 0.5, 0.5, 0.16, 0xe4c98a, sx + dx, 1.05, -5.3);   // cushions
  }

  // Low table in front of the sofa, and a rug the characters stand on.
  box(g, 1.3, 0.12, 0.8, WOOD, sx, 0.52, -3.7);
  for (const [dx, dz] of [[-0.5, -0.3], [-0.5, 0.3], [0.5, -0.3], [0.5, 0.3]]) {
    box(g, 0.1, 0.5, 0.1, WOOD, sx + dx, 0.25, -3.7 + dz);
  }
  const rug = new THREE.Mesh(new THREE.CircleGeometry(2.6, 24), mat(0xc4855f));
  rug.rotation.x = -Math.PI / 2;
  rug.position.set(0, 0.012, -1.4);
  rug.receiveShadow = true;
  g.add(rug);

  // Shelf unit at the right edge, with books as colour blocks.
  const bx = 3.6;
  box(g, 1.5, 2.1, 0.45, WOOD, bx, 1.05, -5.5);
  for (const [y, n] of [[0.55, 5], [1.15, 4], [1.72, 6]]) {
    for (let i = 0; i < n; i++) {
      box(g, 0.13, 0.42, 0.28, [0xc9584f, 0x4f7fc9, 0xd9a441, 0x5aa657,
                                0x8f5fb0, 0xd07a3c][i % 6],
          bx - 0.5 + i * 0.19, y + 0.2, -5.4);
    }
  }
  plant(g, 2.9, -4.4, 1.2);
  plant(g, -5.2, -4.6, 1.0);

  // A ceiling lamp, hung into the top of a wide shot so the frame has
  // something at head height other than wall.
  cyl(g, 0.02, 0.02, 1.4, 0x4a4a4a, 0, 4.4, -3.4, 6);
  cyl(g, 0.42, 0.26, 0.36, 0xf2e0b0, 0, 3.55, -3.4, 12);
}

/** Outside the same house: front wall, roof, garden. */
function buildHouseOut(g) {
  const WALL = 0xf0d9a8, ROOF = 0xb1543f, WOOD = 0x8b5a33, TRIM = 0xfbf3e6;

  // Set well back, and no taller than the frame. The first version put a
  // five-metre house four metres behind the characters, which cropped the roof
  // clean off -- the whole thing that makes a house read as a house.
  const hx = -1.2, hz = -14;
  box(g, 9, 4.0, 6, WALL, hx, 2.0, hz - 2);
  // Pitched roof: two slabs leaning together, and a chimney.
  for (const s of [-1, 1]) {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.32, 6.6), mat(ROOF));
    slab.position.set(hx + s * 2.3, 4.6, hz - 2);
    slab.rotation.z = s * -0.42;
    slab.castShadow = true;
    g.add(slab);
  }
  box(g, 0.8, 1.3, 0.8, 0xa04a38, hx + 2.8, 5.4, hz - 2);

  // Front door and two windows, all facing the camera.
  box(g, 1.4, 2.6, 0.2, WOOD, hx, 1.3, hz + 1.05);
  box(g, 1.7, 0.2, 0.3, TRIM, hx, 2.68, hz + 1.08);
  cyl(g, 0.08, 0.08, 0.16, 0xd8b25a, hx + 0.5, 1.35, hz + 1.2, 8)
    .rotation.x = Math.PI / 2;
  for (const dx of [-3.0, 3.0]) {
    box(g, 1.7, 1.4, 0.16, 0x9fd0e8, hx + dx, 2.3, hz + 1.05, 0.3);
    box(g, 2.0, 0.18, 0.26, TRIM, hx + dx, 3.08, hz + 1.08);
    box(g, 2.0, 0.18, 0.26, TRIM, hx + dx, 1.55, hz + 1.08);
    box(g, 0.14, 1.6, 0.2, TRIM, hx + dx, 2.3, hz + 1.1);
  }

  // Garden. A path under the characters' feet gives the ground something to
  // be, and a fence across the middle distance stops the grass running flat to
  // the horizon. The fence used to sit at z 2.5 -- behind the camera, which
  // parks at 2.9 and looks the other way, so it was never once rendered.
  const path = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 20), mat(0xcbb894));
  path.rotation.x = -Math.PI / 2;
  path.position.set(hx, 0.012, hz + 11);
  path.receiveShadow = true;
  g.add(path);

  for (let x = -16; x <= 16; x += 1.5) {
    if (Math.abs(x - hx) < 1.8) continue;           // gateway onto the path
    box(g, 0.16, 1.0, 0.12, 0xe8e0cf, x, 0.5, -5.5);
  }
  for (const x of [-9, 5.5]) box(g, 13, 0.14, 0.16, 0xe8e0cf, x, 0.92, -5.5);

  tree(g, -6.5, -8, 1.4);
  tree(g, 6.2, -9, 1.2);
  tree(g, 8.5, -3.5, 1.0);
  for (const [x, z, s] of [[-3.6, -4.0, 1.1], [3.4, -4.2, 0.9], [5.2, -1.5, 0.8]]) {
    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 10, 8), mat(0x4b8f4a));
    bush.position.set(x, 0.5 * s, z);
    bush.castShadow = true;
    bush.receiveShadow = true;
    g.add(bush);
  }
  // Distant hills, so the horizon is not a hard line where grass meets sky.
  for (const [x, z, r] of [[-16, -26, 9], [4, -30, 11], [20, -24, 8]]) {
    const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10), mat(0x86b97a));
    hill.position.set(x, -r * 0.55, z);
    g.add(hill);
  }
}

const BUILDERS = { house_in: buildHouseIn, house_out: buildHouseOut };

/** The simple rooms this started with, kept for the sets nobody rebuilt. */
function buildPlainRoom(g, c) {
  box(g, 40, 14, 0.3, c.wall, 0, 7, -6);
  box(g, 7.2, 3.2, 0.18, 0x8d5a3b, 0, 2.6, -5.85);
  box(g, 6.8, 2.8, 0.06, 0xfafafa, 0, 2.6, -5.72);
}

function buildRoom(name) {
  const key = ALIAS[name] || name;
  const c = PALETTES[key] || PALETTES.house_in;
  const group = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), mat(c.floor));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  group.add(floor);

  if (BUILDERS[key]) BUILDERS[key](group);
  else if (key === 'park') { tree(group, -5, -4, 1.3); tree(group, 5.5, -3, 1.1); }
  else buildPlainRoom(group, c);

  group.userData.palette = c;
  return group;
}

// --- lighting -------------------------------------------------------------
// Three lights doing three jobs, rather than one bright one doing all of them.
// A single overhead key is why the characters used to look pasted onto the
// background: nothing separated them from it.
//
// Filmic tone mapping is the other half. Without it the bright cartoon colours
// clip to flat patches wherever the key hits, and clipping is the thing that
// most reliably reads as "rendered" rather than "shot".
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

// Sky above, warm bounce off the floor below.
scene.add(new THREE.HemisphereLight(0xd8ecff, 0xb08a5c, 1.35));

// Key: warm, high and to one side, and the only light that casts.
const key = new THREE.DirectionalLight(0xfff0d8, 2.4);
key.position.set(6, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -14; key.shadow.camera.right = 14;
key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
key.shadow.bias = -0.0012;
key.shadow.normalBias = 0.02;
scene.add(key);

// Fill: cool, opposite the key, weak. It keeps the shadow side of a face from
// going to mud without flattening the modelling the key just created.
const fill = new THREE.DirectionalLight(0xbfd8ff, 0.7);
fill.position.set(-7, 3.5, 4);
scene.add(fill);

// Rim: behind and above, aimed back at the camera. This is the light that
// draws a bright edge along hair and shoulders and lifts the characters off
// the wall behind them.
const rim = new THREE.DirectionalLight(0xffe6c0, 1.5);
rim.position.set(-2, 5, -7);
scene.add(rim);

// --- loading --------------------------------------------------------------
// A fresh loader per file, deliberately. FBXLoader keeps its parse state in
// module scope, so loading a second FBX through the same instance hands it the
// first file's textures -- two different characters render as the same one,
// and the file on disk looks like the culprit when it is not.
const load = p => new Promise((res, rej) => {
  const loader = p.endsWith('.fbx') ? new FBXLoader() : new GLTFLoader();
  loader.load(p, res, undefined, rej);
});

// How tall a character stands, in metres -- the rooms are built in metres,
// while Mixamo exports each character in units of its own choosing.
const TARGET_HEIGHT = 1.6;

/** Move a clip from the source rig onto a target rig.
 *
 * Renaming the tracks is not enough. The two skeletons share bone names once
 * the "mixamorig" prefix is stripped, but they do not share a rest pose --
 * Xbot rests in a T-pose, the avatar in an A-pose. Copying raw local
 * rotations across that difference produces a character with its legs coming
 * out of its head, which is what happened before this used SkeletonUtils.
 *
 * retargetClip computes the delta between the two rest poses, which is the
 * part that actually makes the motion transfer.
 */
function retarget(targetModel, sourceModel, clip) {
  const names = {};
  sourceModel.traverse(o => {
    if (o.isBone) names[o.name] = o.name.replace(/^mixamorig/, '');
  });
  const out = SkeletonUtils.retargetClip(targetModel, sourceModel, clip, {
    names,
    hip: 'mixamorigHips',
    // Characters stand and talk; root motion would slide them off their mark.
    useFirstFramePosition: true,
  });
  out.name = clip.name;
  return out;
}

const actors = [];   // { model, mixer, morphMeshes, actions }

/** An FBX loads as the object itself; a glTF wraps it in .scene. */
function rootOf(asset) {
  return asset.scene || asset;
}

/** Make one model read as a second, different person.
 *
 * Mixamo characters carry their whole appearance in a single textured
 * material, so recolouring alone tints the skin along with the clothes. Three
 * weaker signals together do the job better than one strong one: a height
 * difference, a small hue shift, and -- the one that matters most -- a time
 * offset, because two figures moving in perfect lockstep read as a mirror
 * rather than as two people.
 */
const VARIANT = { scale: 0.88, hue: 0.42, timeOffset: 1.7 };

/** Make a Mixamo clip safe to play on a different Mixamo character.
 *
 * Every Mixamo character shares one skeleton and one set of bone names, so
 * rotations transfer as they are. Positions do not: each character is exported
 * in its own units, so the hips track moves a short character kilometres. Drop
 * the position tracks and the clip becomes portable.
 */
function shareable(clip) {
  const out = clip.clone();
  out.tracks = out.tracks.filter(t => !t.name.endsWith('.position'));
  return out;
}

/** Each bone's rotation in the bind pose, read from the skinning data.
 *
 * A bone's own transform is not the rest pose: Mixamo bakes the first frame of
 * whichever animation the character was downloaded with into the node
 * transforms, so a character downloaded mid-crouch "rests" in a crouch. The
 * inverse bind matrices are the one record of how the skeleton stood when the
 * mesh was bound to it.
 */
function restPose(root) {
  const map = new Map();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3();

  // The body's skeleton, not whichever mesh happens to come first: hair and
  // clothing are skinned separately and can carry their own partial skeletons.
  let skeleton = null;
  root.traverse(mesh => {
    if (mesh.isSkinnedMesh && mesh.skeleton &&
        (!skeleton || mesh.skeleton.bones.length > skeleton.bones.length)) {
      skeleton = mesh.skeleton;
    }
  });
  if (!skeleton) return map;

  const { bones, boneInverses } = skeleton;
  const world = boneInverses.map(m => m.clone().invert());
  bones.forEach((bone, i) => {
    const parent = bones.indexOf(bone.parent);
    const local = parent < 0 ? world[i].clone()
                             : world[parent].clone().invert().multiply(world[i]);
    const q = new THREE.Quaternion();
    local.decompose(pos, q, scl);
    map.set(bone.name, q);
  });
  return map;
}

/** Re-express a clip against the target's own rest pose.
 *
 * Copying local rotations across characters assumes both rigs rest the same
 * way, and they do not: one character rests with her head tilted back, so
 * playing another's head rotation left her staring at the ceiling for the
 * whole scene -- with her mouth aimed there too.
 *
 * What transfers is the movement away from rest, not the rotation itself. Rest
 * poses that do match give an identity correction, so this is safe to apply to
 * every bone rather than only the ones caught misbehaving.
 */
function toRestOf(clip, sourceRest, model) {
  const out = shareable(clip);
  const target = restPose(model);
  const q = new THREE.Quaternion();

  for (const track of out.tracks) {
    if (!track.name.endsWith('.quaternion')) continue;
    const bone = track.name.slice(0, -'.quaternion'.length);
    const from = sourceRest.get(bone), to = target.get(bone);
    if (!from || !to) continue;

    const correction = to.clone().multiply(from.clone().invert());
    const v = track.values;
    for (let i = 0; i + 3 < v.length; i += 4) {
      q.set(v[i], v[i + 1], v[i + 2], v[i + 3]).premultiply(correction);
      v[i] = q.x; v[i + 1] = q.y; v[i + 2] = q.z; v[i + 3] = q.w;
    }
  }
  return out;
}

// Whichever character is loaded, this is the animation it speaks with. Letting
// each model play the clip it happened to be downloaded with means a character
// downloaded with a dance clip dances through its dialogue.
const TALK_CLIP = './assets/mixamo/char_talking.fbx';

/** Give a character a mouth that can open.
 *
 * Mixamo's auto-rigger strips the facial rig: not one of these models has a
 * blend shape or a jaw bone, and the mouth is painted into the face texture.
 * So the mouth is added as its own small mesh, sitting just off the face and
 * parented to the head bone so it follows every turn and nod.
 *
 * It is hidden when the character is quiet, which uncovers the painted smile
 * underneath -- open when speaking, smiling when not, which is how hand-drawn
 * cartoons have always done it.
 *
 * Where the face is cannot be guessed. These characters range from ordinary
 * proportions to a head half the height of the body, so a fixed depth either
 * buries the mouth inside the skull or leaves it floating in front. Instead a
 * ray is fired outward from inside the head and the mouth is placed wherever
 * it leaves the surface.
 */
// Everything here is a fraction of the character's own head, never a fixed
// size. These heads run from a seventh of the body to nearly a third, so a
// mouth measured in centimetres fits one of them and swallows the next one's
// face. The rig's Head-to-HeadTop_End distance gives the head's true length,
// which the model's bounding box does not -- hair and a cap are in the box.
const MOUTH = {
  // The closed lip line, above the head bone, as a fraction of head length
  // (overridable per job -- see mouthUp). Found by rendering candidates and
  // looking at them, which is the only way: 0.20 is where the arithmetic says
  // it goes if you keep the old centred mouth's midpoint, and on a face it
  // lands under the nose with the character's painted mouth still showing
  // below it. Two mouths at once is what "the mouth is wrong" looked like.
  up: 0.13,
  width: 0.15,     // corner to corner, neutral
  height: 0.20,    // how far the jaw drops at full open
  // How far the whole assembly stands off the skin. This has to stay small,
  // and not for the reason it looks like. The mouth is rigidly parented to the
  // head bone while the face is skinned to it, so anything sitting proud of
  // the skin swings on a longer arm than the skin does when the head turns.
  // At 0.03 the mouth left the face and slid towards a cheek on every turn --
  // it read as a misplaced mouth, when it was a mouth mounted too far forward.
  out: 0.012,
  lipLine: 0.020,  // thickness of the lip border around the opening
  depth: 0.18,     // of the width -- shallow, for the same reason as `out`
  cavity: 0x3a1418,
  lip: 0xa85a54,
};

// Overridable per job so the right value can be found by rendering candidates
// and looking at them, rather than by reasoning about a skull.
let mouthUp = MOUTH.up;

function findBone(model, re) {
  let found = null;
  model.traverse(o => { if (!found && o.isBone && re.test(o.name)) found = o; });
  return found;
}

// Measuring from the chin was tried and does not work: hair is skinned to the
// head bone exactly like the chin is, so a fringe or a set of curlers becomes
// the lowest "head" vertex and the mouth follows it down the neck. The head
// bone to the crown bone is the one span the rig reports honestly.

/** Take a measurement with the model standing in its bind pose.
 *
 * Mixamo bakes the first frame of whichever clip the character was downloaded
 * with into the node transforms, so a character downloaded mid-sentence
 * "rests" with its head turned and tipped back. Firing the mouth ray through
 * that pose sends it out through a temple -- and because the mouth is then
 * parented to the head at that offset, it stays on the temple for the whole
 * video, sliding around the face as the head moves. The bind pose is the one
 * pose in which the character is known to be facing straight forward.
 */
function inRestPose(model, measure) {
  const rest = restPose(model);
  const saved = [];
  model.traverse(o => {
    if (o.isBone && rest.has(o.name)) {
      saved.push([o, o.quaternion.clone()]);
      o.quaternion.copy(rest.get(o.name));
    }
  });
  model.updateMatrixWorld(true);
  try {
    return measure();
  } finally {
    for (const [bone, q] of saved) bone.quaternion.copy(q);
    model.updateMatrixWorld(true);
  }
}

/** Give the face a jaw it does not have, by building the blend shape itself.
 *
 * Mixamo's auto-rigger strips every facial blend shape, so these characters
 * arrive with an empty morphTargetDictionary and the code above that would
 * drive a real mouth never fires. Buying models that have one turned out to be
 * its own problem: Ready Player Me shut down, and the free VRM libraries are
 * anime avatars, licensed per model, and nothing like a children's cartoon.
 *
 * So the blend shape is computed here instead. Every vertex below the mouth
 * line and in front of the ears is rotated about a hinge, exactly as a jaw
 * hinges, and the result is stored as a morph target. The face's own skin then
 * opens -- and the mouth painted on the texture opens with it, which is the
 * part no amount of geometry bolted in front of the face could ever do.
 *
 * The dark cavity mesh stays. Skin alone stretches rather than reveals; the
 * cavity is what makes the gap read as an opening.
 */
const JAW = {
  angle: 0.42,     // radians at full open
  ramp: 0.45,      // how far below the lip the jaw reaches full swing, in spans
  radius: 0.85,    // nothing further than this from the mouth moves, in spans
};

const smoothstep = t => t * t * (3 - 2 * t);

function buildJaw(model, head, span, mouth) {
  const hinge = new THREE.Vector3();
  head.getWorldPosition(hinge);
  // The hinge sits level with the mouth and back towards the ears, which is
  // roughly where a real jaw pivots. Hinging at the chin swings the whole face.
  hinge.setY(mouth.y + span * 0.12);
  hinge.z -= span * 0.15;

  const meshes = [];
  const v = new THREE.Vector3();
  const rotated = new THREE.Vector3();
  const axis = new THREE.Vector3(1, 0, 0);

  model.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const pos = o.geometry.attributes.position;
    const deltas = new Float32Array(pos.count * 3);
    let moved = 0;

    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      // Bind-pose vertices are in the mesh's own space; the measurements are
      // in world space because that is where the head bone and the raycast
      // live.
      const world = o.localToWorld(v.clone());

      const below = mouth.y - world.y;
      if (below <= 0) continue;                       // above the mouth: fixed

      // Bounded to a ball around the mouth. Without this the test "below the
      // mouth line" is true of the entire body, and the first build swung
      // 44,000 vertices -- chest, legs and shoes -- about the jaw hinge.
      const reach = span * JAW.radius;
      const dist = world.distanceTo(mouth);
      if (dist >= reach) continue;

      // Full swing at the chin, nothing at the lip line, and fading out at the
      // edge of the ball so there is no crease where moving skin meets still.
      const w = smoothstep(Math.min(1, below / (span * JAW.ramp)))
              * (1 - smoothstep(dist / reach));
      if (w < 0.001) continue;

      rotated.copy(world).sub(hinge)
             .applyAxisAngle(axis, JAW.angle * w).add(hinge);
      const local = o.worldToLocal(rotated);
      deltas[i * 3] = local.x - v.x;
      deltas[i * 3 + 1] = local.y - v.y;
      deltas[i * 3 + 2] = local.z - v.z;
      moved++;
    }

    if (!moved) return;
    o.geometry.morphAttributes.position = [new THREE.Float32BufferAttribute(deltas, 3)];
    o.geometry.morphTargetsRelative = true;
    o.updateMorphTargets();
    o.morphTargetDictionary = { jawOpen: 0 };
    o.morphTargetInfluences = [0];
    meshes.push({ mesh: o, moved });
  });
  return meshes;
}

function addMouth(model, box) {
  const head = findBone(model, /head$/i) || findBone(model, /head/i);
  if (!head) return null;
  return inRestPose(model, () => buildMouth(model, box, head));
}

function buildMouth(model, box, head) {
  const headPos = new THREE.Vector3();
  head.getWorldPosition(headPos);

  const crown = findBone(model, /headtop/i);
  const crownY = crown ? crown.getWorldPosition(new THREE.Vector3()).y
                       : box.max.y * model.scale.y + model.position.y;
  const span = Math.max(0.02, crownY - headPos.y);

  const forward = new THREE.Vector3(0, 0, 1).applyEuler(model.rotation).normalize();
  const origin = headPos.clone().setY(headPos.y + span * mouthUp);
  // The outermost hit, not the first: the ray starts inside the head, so it
  // leaves through eyeballs and teeth before it reaches the skin. Capped at
  // roughly a head's width so a stray hair or a cap brim cannot pull the mouth
  // out into the air.
  const hits = new THREE.Raycaster(origin, forward, 0.001, span * 1.3)
    .intersectObject(model, true).filter(h => h.object.isMesh);
  const surface = hits.length ? hits[hits.length - 1].point
                              : origin.clone().addScaledVector(forward, span * 0.5);

  // Two layers: a lip border with the cavity inside it. One bare dark blob was
  // what the mouth used to be, and that is a hole punched in a face; the rim
  // is what turns it into an opening between lips.
  //
  // A row of upper teeth was tried as a third layer and taken out again. These
  // characters' heads range from ordinary proportions to a third of the body,
  // and no single shape sat right on both: the same strip that vanished inside
  // one character's mouth surfaced at the corners of the other's as a pair of
  // fangs. A mouth with no teeth reads as a mouth on every face.
  //
  // Each dome is translated so its top edge sits on the group's origin. That
  // is the jaw: opening scales it downward only. The old mouth was centred on
  // its anchor, so it opened upward as well, through the top lip and towards
  // the nose, and no amount of tuning the audio was going to fix that.
  const dome = () => {
    const g = new THREE.SphereGeometry(0.5, 20, 14);
    g.translate(0, -0.5, 0);
    return g;
  };
  const flat = c => new THREE.MeshBasicMaterial({ color: c });

  const mouth = new THREE.Group();
  const lips = new THREE.Mesh(dome(), flat(MOUTH.lip));
  const cavity = new THREE.Mesh(dome(), flat(MOUTH.cavity));
  mouth.add(lips, cavity);
  mouth.visible = false;
  mouth.userData.parts = { lips, cavity };

  // Built here, while the model is still standing in its bind pose and the
  // mouth line has just been measured -- both are what the hinge needs.
  mouth.userData.jaw = buildJaw(model, head, span, surface);

  head.add(mouth);
  mouth.position.copy(head.worldToLocal(
    surface.clone().addScaledVector(forward, span * MOUTH.out)));

  // Sit it square to the character rather than to the bone: Mixamo's head bone
  // points up the neck, so its own axes would tip the mouth on its side.
  const hq = new THREE.Quaternion(), mq = new THREE.Quaternion();
  head.getWorldQuaternion(hq);
  model.getWorldQuaternion(mq);
  mouth.quaternion.copy(hq.invert().multiply(mq));

  // The bone carries the model's scale, so undo it: sizes below are in world
  // metres, derived from this character's own head.
  mouth.userData.unit = span / (model.scale.x || 1);
  return mouth;
}

// How far the pair angle in towards each other, in radians. Square to camera
// reads as two people addressing the viewer; turned, as two people talking.
const TURN = 0.42;

async function makeActor(avatarPath, clipSource, x, faceLeft, variant, talk,
                         turn = TURN) {
  const asset = await load(avatarPath);
  const model = rootOf(asset);
  asset.animations = asset.animations || model.animations || [];

  // Scale off the model's own height, not a fixed factor. Mixamo exports each
  // character in its own units, so a single constant makes one character
  // correct and the next one a giant standing beside it.
  //
  // Height is measured to the crown bone rather than the top of the bounding
  // box, because the box contains hair: a character in curlers and a cap was
  // scaled down until her face sat below everyone else's and the camera looked
  // over the top of her head.
  const wanted = TARGET_HEIGHT * (variant ? VARIANT.scale : 1);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const crown = findBone(model, /headtop/i);
  const top = crown ? crown.getWorldPosition(new THREE.Vector3()).y : box.max.y;
  const height = top - box.min.y;
  if (height > 0.0001) model.scale.setScalar(wanted / height);

  const morphMeshes = [];
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      if (o.morphTargetDictionary) morphMeshes.push(o);
      if (variant) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        o.material = mats.map(m => {
          if (!m) return m;
          const c = m.clone();
          if (c.color) {
            const hsl = {};
            c.color.getHSL(hsl);
            c.color.setHSL((hsl.h + VARIANT.hue) % 1,
                           Math.min(1, hsl.s + 0.25), hsl.l);
          }
          return c;
        });
        if (o.material.length === 1) o.material = o.material[0];
      }
    }
  });
  // Stand it on the floor: a rig whose origin sits at the hips rather than the
  // feet otherwise sinks into the ground or floats above it.
  model.position.set(x, -box.min.y * model.scale.y, 0);
  model.rotation.y = faceLeft ? -turn : turn;
  scene.add(model);
  const mouth = addMouth(model, box);
  const gltf = asset;

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};

  // A model that ships its own clips needs no retargeting at all, and that is
  // by far the most reliable path: cross-rig retargeting between a T-pose and
  // an A-pose skeleton is where this broke repeatedly.
  // Mixamo names every clip "mixamo.com" and adds an empty "Take 001"; both
  // are useless as keys, so clips are numbered by order instead.
  const clips = {};
  const own = (gltf.animations || []).filter(c => c.duration > 0.1).map(shareable);
  const borrowed = (talk ? talk.clips : []).map(c => toRestOf(c, talk.rest, model));
  if (own.length || borrowed.length) {
    // Borrowed clips come first so the shared talking animation wins the 'talk'
    // key: a character downloaded with a dance clip should still speak its
    // lines rather than dance through them.
    [...borrowed, ...own].forEach((clip, i) => {
      const key = i === 0 ? 'talk' : 'clip' + i;
      clips[key] = clip;
      actions[key] = mixer.clipAction(clip);
    });
  } else {
    for (const clip of clipSource.animations) {
      try {
        actions[clip.name] = mixer.clipAction(retarget(model, clipSource.scene, clip));
      } catch (e) {
        console.warn('retarget failed:', clip.name, String(e).slice(0, 90));
      }
    }
  }
  const base = actions['talk'] || actions['idle'] || Object.values(actions)[0];
  if (base) base.play();
  return {
    model, mixer, morphMeshes, actions, clips, mouth, current: base,
    timeOffset: variant ? VARIANT.timeOffset : 0,
  };
}

let room = null;

window.__setup = async (cfg) => {
  try {
    const clipSource = await load('./assets/Xbot.glb');
    const actorA = cfg.actorA || './assets/mixamo/char_talking.fbx';
    const actorB = cfg.actorB || actorA;

    room = buildRoom(cfg.room || 'house_in');
    scene.add(room);
    // Sky behind an exterior, wall colour behind an interior. An interior now
    // has real side walls, so the background is only glimpsed past them --
    // matching it to the wall keeps that glimpse from reading as a hole.
    const palette = room.userData.palette;
    scene.background = new THREE.Color(palette.sky || palette.wall)
      .convertSRGBToLinear();
    // Haze on the exterior only, to push the hills back behind the garden.
    scene.fog = palette.sky
      ? new THREE.Fog(palette.sky, 18, 60) : null;

    const talkAsset = await load(cfg.clip || TALK_CLIP);
    const talk = { clips: talkAsset.animations || [],
                   rest: restPose(rootOf(talkAsset)) };
    if (cfg.mouthUp !== undefined) mouthUp = cfg.mouthUp;
    const turn = cfg.turn === undefined ? TURN : cfg.turn;
    actors.push(await makeActor(actorA, clipSource, -1.05, false, false, talk, turn));
    // The second actor is disguised only when it is the same model as the
    // first; a genuinely different character needs no disguising.
    actors.push(await makeActor(actorB, clipSource, 1.05, true,
                                actorB === actorA && cfg.varyB !== false, talk, turn));

    window.__clips = Object.keys(actors[0].actions);
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.message || e);
  }
};

/** Shape the mouth for one frame.
 *
 *   open  0..1 how far the jaw is down
 *   wide  0..1 how far the corners are pulled back -- 0 is a pursed "oo",
 *              1 a spread "ee". Openness alone can only make the same shape
 *              bigger, which is why every sound used to look identical.
 */
function setMouth(mouth, open, wide) {
  // The jaw runs whether or not the cavity is showing, and it is the part that
  // makes this a face rather than a mask: the skin moves, and the mouth
  // painted on the texture moves with it.
  for (const { mesh } of mouth.userData.jaw || []) {
    if (mesh.morphTargetInfluences) mesh.morphTargetInfluences[0] = open;
  }

  // No pop: the closed mouth is a thin line rather than a hidden object, so
  // there is nothing to appear at the moment speech starts.
  mouth.visible = open > 0.012;
  if (!mouth.visible) return;

  const u = mouth.userData.unit;
  const { lips, cavity } = mouth.userData.parts;

  const openY = MOUTH.height * (0.05 + 0.95 * open) * u;
  // Slightly wider as it opens too, but far less than it is tall: a mouth
  // that scales evenly reads as a growing circle instead of a jaw coming down.
  const openX = MOUTH.width * (0.80 + 0.28 * wide) * (1 + 0.08 * open) * u;
  const deep = MOUTH.width * MOUTH.depth * u;
  const lip = MOUTH.lipLine * u;

  cavity.scale.set(openX, openY, deep);

  // The border sits behind and a little proud on every side, so it shows as a
  // rim rather than a second mouth.
  lips.position.set(0, lip, -deep * 0.15);
  lips.scale.set(openX + 2 * lip, openY + 2 * lip, deep * 0.8);

}

/**
 * One frame.
 *   t        seconds into the beat
 *   speaker  0 or 1 -- whose mouth moves
 *   level    0..1 jaw opening at this instant, from the real audio
 *   wide     0..1 mouth spread at this instant, from the real audio
 *   shot     'wide' | 'left' | 'right'
 */
window.__renderFrame = (t, speaker, level, wide, shot) => {
  for (let i = 0; i < actors.length; i++) {
    const a = actors[i];
    // Offsetting the second actor stops the pair moving as a mirror image,
    // which is what gives away that they are one model twice.
    a.mixer.setTime(t + (a.timeOffset || 0));

    const talking = i === speaker;
    // Mouth follows the audio, not a timer, so it stops when the voice stops.
    // No gain applied here: the analysis already normalises against the track,
    // and the 1.35x this used to carry was covering for a driver that never
    // reached the top of its range honestly.
    const open = talking ? Math.min(1, Math.max(0, level)) : 0;
    for (const mesh of a.morphMeshes) {
      const d = mesh.morphTargetDictionary;
      if (d.mouthOpen !== undefined) mesh.morphTargetInfluences[d.mouthOpen] = open;
      if (d.mouthSmile !== undefined) mesh.morphTargetInfluences[d.mouthSmile] = talking ? 0.2 : 0.4;
    }

    // Below a whisper the mouth closes to nothing and the painted smile shows
    // through, so a pause reads as a pause rather than a held vowel.
    if (a.mouth) setMouth(a.mouth, open, talking ? Math.min(1, Math.max(0, wide)) : 0.4);
  }

  // Framing: characters should fill the frame the way they do on a cartoon
  // channel, not stand small in a wide room.
  //
  // A camera's field of view is vertical, so a portrait frame sees barely a
  // third of the width a landscape one does. A Short therefore holds whoever
  // is speaking, from further back: the two-shot that reads well in 16:9 puts
  // both characters outside a 9:16 frame entirely.
  const sway = Math.sin(t * 0.25) * 0.18;
  const portrait = W < H;
  const view = portrait ? (speaker ? 'right' : 'left') : shot;

  if (view === 'left' || view === 'right') {
    const x = view === 'left' ? -1.05 : 1.05;
    camera.position.set(x * 0.95 + sway * 0.4, portrait ? 1.10 : 1.35,
                        portrait ? 2.6 : 1.55);
    camera.lookAt(x, portrait ? 0.85 : 1.25, 0);
  } else {
    camera.position.set(sway, 1.30, 2.9);
    camera.lookAt(0, 1.0, 0);
  }

  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};

window.__info = () => ({
  ready: !!window.__ready, error: window.__error || null,
  clips: window.__clips || [],
  morphs: actors[0] ? Object.keys(actors[0].morphMeshes[0]?.morphTargetDictionary || {}) : [],
  // Where each mouth ended up, against the head it was measured from. A mouth
  // that never appears on camera is either missing or buried, and only these
  // numbers say which.
  mouths: actors.map(a => {
    if (!a.mouth) return null;
    const p = a.mouth.getWorldPosition(new THREE.Vector3());
    const head = findBone(a.model, /head$/i);
    const crown = findBone(a.model, /headtop/i);
    const at = b => b ? +b.getWorldPosition(new THREE.Vector3()).y.toFixed(3) : null;
    // x as well as y: a mouth sitting off the facial midline is the failure
    // that a single elevation number cannot show.
    const xOf = o => o ? +o.getWorldPosition(new THREE.Vector3()).x.toFixed(3) : null;
    // How many vertices the built jaw actually moves. Zero means the blend
    // shape exists and does nothing, which on screen is indistinguishable from
    // not having built it at all.
    const jaw = (a.mouth.userData.jaw || []).map(j => j.moved);
    return { y: +p.y.toFixed(3), z: +p.z.toFixed(3),
             head: at(head), crown: at(crown), jaw,
             x: +p.x.toFixed(3), headX: xOf(head), modelX: +a.model.position.x.toFixed(3) };
  }),
});
</script>
