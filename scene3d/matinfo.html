<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "./assets/three.module.js",
  "three/addons/": "./assets/addons/",
  "fflate": "./assets/addons/libs/fflate.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// To make one model read as two different people, the clothes and hair have
// to be recoloured while the skin is left alone. That needs to know which
// material is which.
new FBXLoader().load('./assets/mixamo/char_talking.fbx', obj => {
  const mats = [];
  obj.traverse(o => {
    if (!o.isMesh) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      if (!m) continue;
      const hsl = {};
      if (m.color) m.color.getHSL(hsl);
      mats.push({
        mesh: o.name,
        material: m.name,
        color: m.color ? '#' + m.color.getHexString() : null,
        h: hsl.h !== undefined ? +hsl.h.toFixed(2) : null,
        s: hsl.s !== undefined ? +hsl.s.toFixed(2) : null,
        l: hsl.l !== undefined ? +hsl.l.toFixed(2) : null,
        map: !!m.map,
      });
    }
  });
  window.__out = mats;
  window.__done = true;
}, undefined, e => { window.__out = { error: String(e) }; window.__done = true; });
</script>
