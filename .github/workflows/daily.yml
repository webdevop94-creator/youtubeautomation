# Build and publish the daily videos on GitHub's machines instead of the
# laptop, so a shut-down PC stops being the reason a day gets skipped.
#
# Windows Task Scheduler cannot help with that. WakeToRun brings a machine back
# from sleep or hibernate, but nothing wakes a computer that has been shut
# down. This runs whether the laptop is on, off, or somewhere else entirely.
name: Daily videos

on:
  schedule:
    # GitHub cron is UTC. 01:30 UTC = 07:00 IST, 02:30 UTC = 08:00 IST.
    # Worth knowing: scheduled runs are queued, not guaranteed on the minute --
    # GitHub delays them under load, sometimes by up to an hour. If the exact
    # hour matters, this is the wrong tool; if "once each morning" matters, it
    # is the right one.
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Kitni videos banani hain"
        default: "1"
      privacy:
        description: "public / unlisted / private"
        default: "public"
      kind:
        description: "stories / facts / riddles / jokes (khaali = rotation)"
        default: ""

# One run at a time. Two agents at once share one history.json with no locking
# between them, so they can pick the same topic and overwrite each other's
# entry -- and on a scheduled pair an hour apart that is not hypothetical.
concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90            # free minutes are finite; do not run away
    permissions:
      contents: write              # to push history.json back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -qq
          # Devanagari fonts are not optional. libass draws every glyph it has
          # no font for as an empty box and reports success either way, so
          # without these the Hindi captions arrive as rows of rectangles in a
          # video that looks, from the logs, like it worked.
          #
          # fonts-noto-core carries Noto Sans Devanagari, which is the family
          # video._caption_font asks libass for by name on Linux.
          # fonts-lohit-deva carries Lohit-Devanagari.ttf, which is the last
          # entry in video.DEVANAGARI_FONTS. There is no fonts-noto-devanagari
          # package on Ubuntu -- that guess cost the first run.
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-lohit-deva
          echo "--- Devanagari fonts mile: ---"
          fc-list :lang=hi family | sort -u | head
          fc-list :lang=hi | grep -q . || { echo "Devanagari font missing"; exit 1; }

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Write .env and YouTube token
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # Keys come from secrets; everything else is ordinary configuration
          # and lives here in the open where it can be read and changed.
          cat > .env <<ENV
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          NVIDIA_API_KEY=$NVIDIA_API_KEY
          PEXELS_API_KEY=$PEXELS_API_KEY
          ELEVEN_API_KEY=$ELEVEN_API_KEY
          YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET

          TTS_ENGINE=edge
          # One narrator, and a female one. The two-character dialogue and the
          # named cast were both dropped at the owner's call -- the videos are
          # explainers now, not a two-hander.
          DIALOGUE=false
          VOICE=hi-IN-SwaraNeural
          VOICE_RATE=-2%

          CONTENT_MODE=animation
          # World facts only, at the owner's call. A fact needs no character
          # held across scenes -- the one thing generation cannot do -- and a
          # named place is the one subject Pexels reliably has real footage of,
          # which riddles and stories do not.
          ANIMATION_KINDS=facts
          # photo, not animation. This only governs the beats where stock has
          # nothing, and those stills sit directly next to real footage -- an
          # illustrated frame in the middle of filmed clips reads as a mistake.
          # "animation" here is what was making the videos look like cartoons.
          VISUAL_STYLE=photo
          # On, but as the fallback rather than the first choice. Pexels is
          # asked for real footage on every beat; generation catches the beats
          # stock has never filmed. See visuals.fetch_visuals.
          USE_AI_VISUALS=true
          # 1:30. config derives the beat count and the words per beat from
          # this alone, so it comes out at 4 facts of ~54 words rather than
          # needing either number set by hand.
          MAX_VIDEO_MINUTES=1.5
          # 45 days of history is the avoid-list the writer is handed, and at
          # two videos a day that is 90 fact sets it must not repeat. Long
          # enough to matter, short enough that the brief stays readable.
          HISTORY_DAYS=45
          FPS=30
          MUSIC_VOLUME_DB=-22
          ENV
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .youtube_token.json
          python -c "import json;json.load(open('.youtube_token.json'));print('token JSON theek hai')"

      - name: Build and upload
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONIOENCODING: utf-8
          # Without this the log stops at whatever filled the last 8 KB buffer
          # and stays there for twenty minutes, which is indistinguishable from
          # a hung render while you are watching it.
          PYTHONUNBUFFERED: "1"
        run: |
          python agent.py \
            --count "${{ inputs.count || '1' }}" \
            --privacy "${{ inputs.privacy || 'public' }}" \
            ${{ inputs.kind && format('--kind {0}', inputs.kind) || '' }}

      - name: Remember what was covered
        # The duplicate guard is only useful if it survives the runner, which
        # is deleted the moment this finishes. Committing it back is the whole
        # mechanism; a cache would expire and quietly start repeating topics.
        if: always()
        run: |
          git config user.name "youtube-automation"
          git config user.email "actions@github.com"
          git add history.json || true
          git diff --cached --quiet || git commit -m "history: $(date -u +%F) ka run"
          git pull --rebase --autostash || true
          git push || echo "history push nahi hua, agla run dobara koshish karega"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            agent.log
            output/**/script.txt
            output/**/title_and_description.txt
          if-no-files-found: ignore
          retention-days: 7
